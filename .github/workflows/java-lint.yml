name: Java Lint
env:
  GH_GRADLE_SECRET: ${{secrets.ORKES_INTERNAL_RUNNER_SECRET}}
permissions:
  contents: read
  packages: read

on: [push, pull_request]

jobs:
  lint:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*gradle*', '**/gradle.properties', '**/*gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Execution permissions for Gradle wrapper
        run: chmod +x gradlew

      - name: Configure Git for GitHub Packages
        run: |
          git config --global url."https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@maven.pkg.github.com/".insteadOf "https://maven.pkg.github.com/"

      - name: Spotless Check
        run: ./gradlew spotlessCheck --continue
        continue-on-error: true

      - name: PMD Main Source Analysis
        run: ./gradlew pmdMain --continue
        continue-on-error: true

      - name: PMD Test Source Analysis
        run: ./gradlew pmdTest --continue
        continue-on-error: true
